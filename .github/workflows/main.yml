name: RDP Tunnel via Cloudflare

on:
  workflow_dispatch:   # 手动触发，方便调试

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 设置 RDP 密码（从 Secrets 读取）
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) { $password = "P@sswOrd" }  # 默认密码（不安全，建议配置 secret）
          Set-LocalUser -Name 'runneradmin' -Password (ConvertTo-SecureString -AsPlainText $password -Force)
        shell: pwsh

      - name: 启用 RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp\' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        shell: pwsh

      - name: 安装 cloudflared
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:TEMP\cloudflared.exe"
          Move-Item "$env:TEMP\cloudflared.exe" -Destination "$env:ProgramFiles\cloudflared.exe" -Force
        shell: pwsh

      - name: 启动 Cloudflare Tunnel（暴露 3389）
        run: |
          & "$env:ProgramFiles\cloudflared.exe" tunnel --url rdp://localhost:3389
        shell: pwsh
        # 这个步骤会一直运行，日志里会显示一个随机的 *.trycloudflare.com 域名，复制它即可用 RDP 连接
